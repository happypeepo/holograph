app = "spatial-twin"
primary_region = "bom"          # Mumbai: same city as the buildings and the audience

[build]

[http_service]
  internal_port = 8000
  force_https = true            # the PWA service worker needs a secure context
  auto_start_machines = true
  # Blocked corridors live in memory. Scaling to zero or across machines would
  # lose them mid-demo, so this stays pinned to exactly one always-on machine.
  auto_stop_machines = false
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
