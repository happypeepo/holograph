<!doctype html>
<meta charset="utf-8">
<title>Spatial Twin — Holographic View</title>
<style>
/* ---------------------------------------------------------------------------
   ctOS-over-Gothic. White is the voice of the building, cyan is the voice of
   the system: cyan appears ONLY on something the twin is currently asserting
   (the traced route, the live selection, a reading). Everything else stays
   monochrome, which is what keeps the HUD at a garnish rather than a costume.
   Monospace = instrument layer. Sans = the human conversation.
--------------------------------------------------------------------------- */
:root{
  --void:#07090c; --plate:#0b0f14; --sunk:#080b0f;
  --rule:#18222b; --rule2:#26333d;
  --ink:#e9eef3; --dim:#6d808c; --dimmer:#3f4e58;
  --live:#00e5ff; --halt:#ff3b5c; --ok:#5ef2a8;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:14px/1.5 var(--sans);
     overflow:hidden;display:grid;grid-template-rows:auto 1fr}

/* ---- header: one hairline, no chrome ---- */
header{display:flex;align-items:center;gap:20px;padding:0 20px;height:52px;
       border-bottom:1px solid var(--rule);background:var(--plate)}
.mark{font:600 13px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase}
.mark i{color:var(--live);font-style:normal}
.bld{font:400 12px/1 var(--mono);color:var(--dim);letter-spacing:.06em;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.disc{font:400 10px/1 var(--mono);color:var(--dimmer);letter-spacing:.1em;text-transform:uppercase}
a.exit{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
       text-decoration:none;border:1px solid var(--rule2);padding:8px 12px}
a.exit:hover{color:var(--ink);border-color:var(--dim)}

main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}

/* ---- stage ---- */
/* user-select off across the whole stage: dragging over SVG labels was selecting
   them. Scoped here so chat text in the sidebar stays selectable. */
#stage{position:relative;min-height:0;overflow:hidden;background:var(--void);
       cursor:grab;touch-action:none;
       -webkit-user-select:none;user-select:none}
#stage.drag{cursor:grabbing}
#stage.hot{cursor:pointer}
#svg{width:100%;height:100%;display:block}
/* corner ticks: the frame reads as an instrument viewport, four 1px marks total */
.tick{position:absolute;width:14px;height:14px;pointer-events:none;border:0 solid var(--rule2)}
.tick.tl{top:12px;left:12px;border-top-width:1px;border-left-width:1px}
.tick.tr{top:12px;right:12px;border-top-width:1px;border-right-width:1px}
.tick.bl{bottom:12px;left:12px;border-bottom-width:1px;border-left-width:1px}
.tick.br{bottom:12px;right:12px;border-bottom-width:1px;border-right-width:1px}

.hud{position:absolute;font:400 10px/1.7 var(--mono);letter-spacing:.11em;
     color:var(--dim);pointer-events:none;text-transform:uppercase;
     /* #stage's grab cursor inherits in here, but pointerdown bails on .hud so
        nothing in the HUD ever drags. The polygons and buttons set their own. */
     cursor:default}
.hud.tr{top:26px;right:26px;text-align:right}
.hud.bl{bottom:26px;left:26px}
.hud.br{bottom:26px;right:26px;text-align:right}
.hud b{color:var(--ink);font-weight:500}
.hud .cy{color:var(--live)}
.lg{display:flex;align-items:center;gap:8px;margin-top:5px}
.lg s{width:16px;height:0;border-top:2px solid;display:block;text-decoration:none}

#cube{width:150px;height:150px;display:block;margin:6px 0 2px auto;pointer-events:auto;overflow:visible}
.cubebar{display:flex;gap:9px;align-items:center;justify-content:flex-end;
  pointer-events:auto;margin-top:3px}
.cubebar button{font:500 10px/1 var(--mono);letter-spacing:.14em;color:var(--dim);
  background:none;border:0;padding:0;cursor:pointer;text-transform:uppercase}
.cubebar button:hover{color:var(--live)}
.cubebar button[aria-pressed=true]{color:var(--live)}
.cubebar .arr{font-size:13px;line-height:1;letter-spacing:0;width:13px;text-align:center}
#home{display:block;margin:7px 0 0 auto;padding:4px 9px;color:var(--live);
  border:1px solid var(--rule2);border-radius:2px}
#home:hover{border-color:var(--live);background:rgba(0,229,255,.08)}
#cube polygon{cursor:pointer}
button.lnk{background:none;border:none;padding:0;font:500 10px/1 var(--mono);letter-spacing:.14em;
  color:var(--dim);cursor:pointer;text-transform:uppercase;pointer-events:auto}
button.lnk:hover{color:var(--live)}

/* ---- sidebar ---- */
aside{border-left:1px solid var(--rule);background:var(--plate);min-height:0;overflow:hidden;
      display:flex;flex-direction:column}
.k{font:500 10px/1 var(--mono);letter-spacing:.22em;color:var(--dimmer);text-transform:uppercase;
   margin:0 0 9px;display:flex;align-items:center;gap:10px}
.k::after{content:"";flex:1;height:1px;background:var(--rule)}

/* manual control — the deliberate, precise half of the interface */
#ctrl{padding:12px 18px 14px;border-bottom:1px solid var(--rule)}
.fld{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:9px;margin-bottom:5px}
.fld.sw{grid-template-columns:34px 1fr 34px}
.ghost.ico{padding:9px 0;text-align:center;font-size:13px;letter-spacing:0}
.fld > span{font:500 10px/1 var(--mono);letter-spacing:.14em;color:var(--dimmer)}
select,input[type=text]{width:100%;background:var(--sunk);color:var(--ink);border:1px solid var(--rule2);
  padding:8px 10px;font:400 13px/1 var(--mono);border-radius:0;appearance:none}
select:focus,input:focus{outline:none;border-color:var(--live)}
select:hover{border-color:var(--dim)}
.row{display:flex;gap:7px;align-items:center;margin-top:8px}
.seg{display:flex;flex:1}
.seg button{flex:1;font:500 10px/1 var(--mono);letter-spacing:.12em;color:var(--dim);background:var(--sunk);
  border:1px solid var(--rule2);border-right:0;padding:9px 4px;cursor:pointer;text-transform:uppercase}
.seg button:last-child{border-right:1px solid var(--rule2)}
.seg button:hover{color:var(--ink)}
.seg button.on{color:var(--void);background:var(--ink);border-color:var(--ink)}
.trace{width:100%;margin-top:8px;font:600 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--void);background:var(--live);border:1px solid var(--live);padding:11px;cursor:pointer}
.trace:hover{background:#4af1ff;border-color:#4af1ff}
.ghost{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  background:transparent;border:1px solid var(--rule2);padding:9px 11px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--dim)}
.ghost.halt:hover{color:var(--halt);border-color:var(--halt)}

/* route readout */
#read{padding:13px 18px;overflow:auto;flex:1 1 auto;min-height:120px;border-bottom:1px solid var(--rule)}
.hdr{display:flex;align-items:baseline;gap:11px;margin-bottom:9px}
.dist{font:300 30px/1 var(--mono);letter-spacing:-.02em;color:var(--live)}
.dist s{font-size:13px;color:var(--dim);text-decoration:none;margin-left:4px;letter-spacing:.1em}
.meta{font:400 10px/1 var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
/* route profile: x is distance walked, y is which level you are on, so a climb
   is a visible riser rather than a word buried in a list */
.prof{display:block;max-width:100%;height:auto;margin-bottom:12px;overflow:visible}

/* the spine. Marker shape encodes node type; the rail is one continuous line so
   a level change reads as a break in a journey, not as row 5 of a table. */
.stp{position:relative;display:grid;grid-template-columns:18px 1fr auto;gap:11px;
     align-items:baseline;padding:6px 0;font-size:13.5px;color:#c3ced7}
.stp .g{position:relative;height:1em}
.stp .g::before{content:"";position:absolute;left:5px;top:-13px;bottom:-13px;width:1px;background:var(--rule2)}
.stp:first-of-type .g::before{top:7px}
.stp:last-of-type .g::before{bottom:auto;height:5px}
.stp .g i{position:absolute;left:1px;top:2px;width:9px;height:9px;display:block;
          border:1px solid var(--dim);background:var(--plate)}
.stp[data-t=corridor] .g i{height:1px;top:7px;left:0;width:12px;border:0;background:var(--rule2)}
.stp[data-t=stairs]   .g i{transform:rotate(45deg)}
.stp[data-t=lift]     .g i{border-radius:50%}
.stp[data-t=entrance] .g i{background:var(--dim);border-color:var(--dim)}
.stp.up{color:var(--live)}
.stp.up .g i{border-color:var(--live);background:var(--live)}
.stp.end .g i{border-color:var(--live);background:var(--live);border-radius:50%}
.stp .at{font:400 10px/1.6 var(--mono);color:var(--dimmer);letter-spacing:.06em;white-space:nowrap}
.void{font:400 12px/1.6 var(--mono);color:var(--dimmer);letter-spacing:.06em}
.err{font:400 12.5px/1.6 var(--mono);color:var(--halt);border-left:2px solid var(--halt);padding-left:11px}
.blk{font:400 11px/1 var(--mono);color:var(--halt);letter-spacing:.08em;margin-top:6px}

/* chat — stays exactly where it was, bottom of the sidebar */
#chat{flex:0 0 auto;height:232px;display:flex;flex-direction:column;overflow:hidden;
  padding:14px 18px 16px;background:var(--sunk)}
#log{flex:1 1 auto;overflow:auto;min-height:40px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:90%;padding:9px 12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:#12212a;border-left:2px solid var(--live);color:var(--ink)}
.msg.a{align-self:flex-start;background:#0e141a;border-left:2px solid var(--rule2);color:#c3ced7}
.msg.a.err{border-left-color:var(--halt);color:#ff9aad}
.msg.wait{color:var(--dimmer);font:400 11px/1.6 var(--mono);letter-spacing:.1em;background:none;border-left-color:transparent}
#chips{flex:0 0 auto;display:flex;gap:5px;margin-bottom:9px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#chips::-webkit-scrollbar{height:0}
#chips[hidden]{display:none}
.chip{flex:0 0 auto;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:transparent;border:1px solid var(--rule2);color:var(--dim);padding:6px 9px;
  font:400 11px/1.3 var(--mono);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--live);color:var(--live)}
#cf{flex:0 0 auto;display:flex;gap:8px}
#ci{flex:1;min-width:0;font-family:var(--sans);font-size:13.5px}
#cf button{font:600 11px/1 var(--mono);letter-spacing:.16em;color:var(--void);background:var(--ink);
  border:1px solid var(--ink);padding:0 15px;cursor:pointer}
#cf button:hover{background:var(--live);border-color:var(--live)}

:focus-visible{outline:1px solid var(--live);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--rule2)}
::-webkit-scrollbar-track{background:transparent}

text{font-family:var(--mono);pointer-events:none}
@keyframes march{to{stroke-dashoffset:-32}}
@keyframes climb{to{stroke-dashoffset:-24}}
@keyframes hoist{to{stroke-dashoffset:-129}}
.route{animation:march 1.3s linear infinite}
/* stairs step in discrete beats like footfalls; the lift car glides and settles */
.climb{animation:climb .8s steps(6,end) infinite}
.hoist{animation:hoist 2s cubic-bezier(.5,0,.5,1) infinite}
@media (prefers-reduced-motion:reduce){.route,.climb,.hoist{animation:none}}
</style>

<header>
  <span class="mark">Spatial<i>·</i>Twin</span>
  <span class="bld" id="bld">connecting…</span>
  <span class="grow"></span>
  <span class="disc">illustrative approximation</span>
  <a class="exit" id="alt" hidden>—</a>
  <a class="exit" href="/">Home</a>
</header>

<main>
  <div id="stage">
    <svg id="svg" viewBox="0 0 1400 780" preserveAspectRatio="xMidYMid meet"></svg>
    <span class="tick tl"></span><span class="tick tr"></span>
    <span class="tick bl"></span><span class="tick br"></span>

    <div class="hud tr">
      <div>BRG <b id="oYaw">—</b> · ELV <b id="oPit">—</b> · ZM <b id="oZm">—</b></div>
      <svg id="cube" viewBox="-50 -50 100 100" aria-label="View orientation cube"></svg>
      <div class="cubebar">
        <button class="lnk arr" id="rotL" title="Rotate 90° left" aria-label="Rotate 90 degrees left">&#8630;</button>
        <button class="lnk arr" id="rotR" title="Rotate 90° right" aria-label="Rotate 90 degrees right">&#8631;</button>
        <button class="lnk arr" id="invX" data-ax="Horizontal" aria-pressed="true" aria-label="Invert horizontal drag direction">&#8646;</button>
        <button class="lnk arr" id="invY" data-ax="Vertical" aria-pressed="true" aria-label="Invert vertical drag direction">&#8645;</button>
      </div>
      <button class="lnk" id="home" title="Reset view — isometric, every level">Reset view</button>
    </div>

    <div class="hud bl">
      <div class="lg"><s style="border-color:#8fa3ae"></s>space</div>
      <div class="lg"><s style="border-color:#00e5ff"></s>traced route</div>
      <div class="lg"><s style="border-color:#ff3b5c"></s>blocked</div>
      <div class="lg"><s style="border-color:#26333d;border-top-style:dashed"></s>stair / lift shaft</div>
    </div>

    <div class="hud br"><span id="prompt">drag to orbit · scroll to zoom · shift-drag to pan</span></div>
  </div>

  <aside>
    <div id="ctrl">
      <p class="k">Manual control</p>
      <div class="fld"><span>From</span><select id="from"></select></div>
      <div class="fld sw"><span>To</span><select id="to"></select>
        <button class="ghost ico" id="swap" title="Swap origin and destination" aria-label="Swap origin and destination">⇅</button></div>
      <div class="row">
        <div class="seg" style="flex:0 0 108px"><button id="acc" data-on="0">Step-free</button></div>
        <div class="seg" id="lvl"></div>
      </div>
      <button class="trace" id="go">Trace route</button>
      <div class="row">
        <select id="blk" style="flex:1"></select>
        <button class="ghost halt" id="block">Block</button>
        <button class="ghost" id="clear" title="Lift every blockage">Clear all</button>
      </div>
    </div>

    <div id="read"><p class="k">Route</p><p class="void">No route traced.</p></div>

    <div id="chat">
      <p class="k">Ask</p>
      <div id="log"></div>
      <div id="chips"></div>
      <form id="cf" autocomplete="off">
        <input id="ci" type="text" placeholder="Where do you want to go?" aria-label="Ask about the building">
        <button type="submit">Send</button>
      </form>
    </div>
  </aside>
</main>

<script>
// the page is served at both /3d and /3d/<building>; it talks to whichever
// prefix it was loaded from, so one file serves every twin
const BASE=location.pathname.replace(/\/+$/,'')||'/3d';
const API={state:BASE+'/state',route:BASE+'/route',block:BASE+'/block',chat:BASE+'/chat'};
const HGT={room:80,corridor:24,stairs:66,lift:110,entrance:48};
let LEVEL=340;                 // deck spacing, set from the floor count in loadState
const VW=1400, VH=780;
const ISO={yaw:-0.50,pitch:0.90,scale:0.82,ox:0,oy:104};   // the home view; the cube covers the rest

const svg=document.getElementById('svg'), stage=document.getElementById('stage');
const NS='http://www.w3.org/2000/svg';
const el=(t,a,tx)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);
  if(tx!=null)e.textContent=tx;return e};
const $=id=>document.getElementById(id);

let ST=null, BY={}, ROUTE=null, LASTR=null;
let show=new Set();          // which decks are on; every floor is its own toggle
const DULL=/toilet|corridor|lobby|lift|staircase|store|cabin/i;
let HOVER=null, FROM=null, TO=null, PICK='from', seeded=false;   // click-to-pick walks from -> to -> from
let CX=0, CY=0, dirty=true;
let cam={...ISO}, aim={...ISO};        // cam chases aim: that gap is the whole feel

const LIGHT=[-0.55,-0.84];   // fixed sun, world-space, so form reads while you orbit
// `floor` in the building file is a 1-based DECK INDEX: ground is 1, not 0. Every
// place a floor is shown to a human goes through one of these two, so the ground
// floor can never come back out as "L1".
const LEVEL_NAME=f=>f===1?'GROUND':'LEVEL '+(f-1);
const LVL=f=>f===1?'G':'L'+(f-1);
// a node may lift itself off its deck (z_base) and set its own extrusion (height).
// Used for things that are not a storey tall or do not sit at storey level - the
// entrance steps rise from the forecourt BELOW the ground floor, with the Orion
// workshop tucked underneath them.
const zb=n=>(n.attributes&&+n.attributes.z_base)||0;
const hgt=n=>{const a=n.attributes||{};
  // spans_levels is deck-relative: 1 means 'rises exactly one storey'. LEVEL is
  // computed from the floor count, so a hardcoded height would drift per building.
  if(a.spans_levels) return +a.spans_levels*LEVEL;
  return (+a.height)||HGT[n.type]||36;};
const flr=n=>n.floor||1, base=n=>(flr(n)-1)*LEVEL+zb(n), vis=n=>show.has(flr(n));
const roof=n=>base(n)+hgt(n);   // not `top`: that shadows window.top

function project(x,y,z){
  const dx=x-CX, dy=y-CY;
  const ca=Math.cos(cam.yaw), sa=Math.sin(cam.yaw);
  const rx=dx*ca-dy*sa, ry=dx*sa+dy*ca;
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  return [VW/2+cam.ox+rx*cam.scale, VH/2+cam.oy+(ry*sp-z*cp)*cam.scale, ry*cp+z*sp];
}
const avgz=p=>p.reduce((s,q)=>s+q[2],0)/p.length;

// Frame the whole model at the aimed orientation. A two-storey terminus and a
// seven-storey block need very different zoom, so this is measured, not guessed.
function fitView(){
  if(!ST) return;
  const ca=Math.cos(aim.yaw), sa=Math.sin(aim.yaw);
  const cp=Math.cos(aim.pitch), sp=Math.sin(aim.pitch);
  const flat=(x,y,z)=>{const dx=x-CX, dy=y-CY;
    return [dx*ca-dy*sa, (dx*sa+dy*ca)*sp - z*cp]};
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9, any=false;
  for(const n of ST.nodes){
    if(!vis(n)) continue;
    any=true;
    const r=n.svg_rect;
    for(const [px,py] of [[r[0],r[1]],[r[0]+r[2],r[1]],[r[0]+r[2],r[1]+r[3]],[r[0],r[1]+r[3]]])
      for(const z of [base(n), roof(n)]){
        const q=flat(px,py,z);
        if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0];
        if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1];
      }
  }
  if(!any) return;
  const sc=Math.min(VW*0.80/Math.max(1,x1-x0), VH*0.80/Math.max(1,y1-y0));
  aim.scale=Math.max(0.12,Math.min(2.6,sc));
  aim.ox=-((x0+x1)/2)*aim.scale;
  aim.oy=-((y0+y1)/2)*aim.scale;
}

// "Back to how the page opened": every deck on, isometric, framed to fit. The Iso
// button, the chat reset_view and boot all call this, so they cannot drift apart.
// Camera only - a drawn route and its pins are Escape's job, not this button's.
function resetView(){
  if(!ST) return;
  show=new Set(ST.nodes.map(flr));   // fitView frames only visible decks, so restore them first
  markSeg();
  aim.yaw=ISO.yaw; aim.pitch=ISO.pitch;
  fitView();
  dirty=true;
}
const pts=p=>p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');

/* ---- the damped camera. Everything about "smoother" lives in these 8 lines ---- */
const SNAP=0.18;
function tick(){
  let moved=false;
  for(const k of ['yaw','pitch','scale','ox','oy']){
    const d=aim[k]-cam[k];
    if(Math.abs(d)>1e-4){cam[k]+=d*SNAP; moved=true} else cam[k]=aim[k];
  }
  if(moved||dirty){dirty=false; render(); readout(); drawCube()}
  requestAnimationFrame(tick);
}
function readout(){
  const deg=(-cam.yaw*180/Math.PI+360)%360;
  $('oYaw').textContent=deg.toFixed(0).padStart(3,'0')+'°';
  $('oPit').textContent=(cam.pitch*180/Math.PI).toFixed(0)+'°';
  $('oZm').textContent=cam.scale.toFixed(2)+'×';
}

/* ---- paint ---- */
function tone(n){
  if(!n.passable)                     return {s:'#ff3b5c',f:'rgba(255,59,92,',t:.26};
  if(ROUTE&&ROUTE.includes(n.id))     return {s:'#00e5ff',f:'rgba(0,229,255,',t:.24};
  if(n.id===HOVER||n.id===FROM||n.id===TO)
                                      return {s:'#e9eef3',f:'rgba(233,238,243,',t:.16};
  return {s:'#8fa3ae',f:'rgba(143,163,174,',t:.07};
}

function render(){
  if(!ST) return;
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const [,,vw,vh]=ST.svg_viewbox;
  const floors=[...new Set(ST.nodes.map(flr))].sort((a,b)=>a-b);
  const seen=floors.filter(f=>show.has(f));

  // Painting is grouped BY DECK, not by one global depth sort. A deck is a huge
  // plane and a room is a small box sitting on it; comparing their centroids
  // makes tiles swallow rooms at some angles. Physically the order is fixed:
  // deck N, then everything standing on deck N, then deck N+1. Only the
  // direction flips when the camera drops below the building.
  const decks={}, above={}, orphan=[];
  for(const f of seen){decks[f]=[]; above[f]=[]}
  // Anything belonging to a hidden deck lands in `orphan` and is painted last.
  // That keeps the traced route continuous across floors you have switched off
  // instead of it vanishing mid-climb.
  const onDeck=(f,z,e)=>{ (above[f]||orphan).push({z,e}) };

  const TILE=200;
  for(const f of seen){
    const z=(f-1)*LEVEL, fill=f===1?'#0a1015':'#0c141b';
    for(let x=0;x<vw;x+=TILE) for(let y=0;y<vh;y+=TILE){
      const w=Math.min(TILE,vw-x), h=Math.min(TILE,vh-y);
      const q=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(c=>project(c[0],c[1],z));
      decks[f].push({z:avgz(q),e:el('polygon',{points:pts(q),fill,'fill-opacity':f===1?.92:.34,
        stroke:'#16212a','stroke-width':1,'pointer-events':'none'})});
    }
    if(f>1&&show.has(f-1)) for(const c of [[0,0],[vw,0],[vw,vh],[0,vh]]){
      const p1=project(c[0],c[1],z), p2=project(c[0],c[1],(f-2)*LEVEL);
      decks[f].push({z:Math.min(p1[2],p2[2]),e:el('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],
        stroke:'#16212a','stroke-width':1,'pointer-events':'none'})});
    }
  }

  for(const e of ST.edges){
    const m=BY[e.a],n=BY[e.b]; if(!m||!n||flr(m)===flr(n)) continue;
    if(!vis(m)||!vis(n)) continue;
    const lo=flr(m)<flr(n)?m:n, hi=lo===m?n:m;
    const p1=project(lo.xy[0],lo.xy[1],roof(lo)), p2=project(hi.xy[0],hi.xy[1],base(hi));
    onDeck(flr(lo),(p1[2]+p2[2])/2,el('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],stroke:'#26333d',
      'stroke-width':1.4,'stroke-dasharray':'5 5','stroke-opacity':e.passable?.9:.25,
      'pointer-events':'none'}));
  }

  const RZ=id=>roof(BY[id])+16;

  if(ROUTE&&ROUTE.length>1) for(let i=1;i<ROUTE.length;i++){
    const m=BY[ROUTE[i-1]], n=BY[ROUTE[i]];
    if(flr(m)!==flr(n)||!vis(m)||!vis(n)) continue;
    const z=(flr(n)-1)*LEVEL;
    const p=project(m.xy[0],m.xy[1],z), q=project(n.xy[0],n.xy[1],z);
    onDeck(flr(n),(p[2]+q[2])/2,el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#00e5ff',
      'stroke-width':2,'stroke-opacity':.16,'pointer-events':'none'}));
  }

  for(const n of ST.nodes){
    if(!vis(n)) continue;
    const r=n.svg_rect, x=r[0], y=r[1], w=r[2], h=r[3], z1=base(n), z2=roof(n), f=flr(n);
    // A fixed world-space light. Without it every wall carries the identical tint
    // and the eye is free to flip the solid inside-out (Necker cube).
    const face=(p,isTop,lit)=>{
      const t=tone(n), op=isTop?t.t*1.25:t.t*lit;
      onDeck(f,avgz(p),el('polygon',{points:pts(p),fill:t.f+op.toFixed(3)+')',stroke:t.s,
        'stroke-width':isTop?1.2:.7,'stroke-opacity':isTop?.95:.30+lit*.5,'data-id':n.id}));
    };
    // A node carrying `steps` is drawn as a real stepped solid instead of one box:
    // each tread is its own slab, running from that tread to the head of the flight,
    // so the profile reads as stairs from any angle. `climb` says which way it rises.
    const nsteps=(n.attributes&&+n.attributes.steps)||0;
    const climb=(n.attributes&&n.attributes.climb)||'-y';
    // `rot` spins the whole footprint about its centre, so a flight can run diagonally
    // across the plan instead of being locked to the x/y axes. Slabs are built in the
    // node's own frame and rotated together, so a stepped solid stays one structure.
    const rot=(n.attributes&&+n.attributes.rot)||0;
    const RCX=x+w/2, RCY=y+h/2, RA=rot*Math.PI/180, RS=Math.sin(RA), RC=Math.cos(RA);
    const spin=p=>rot?[RCX+(p[0]-RCX)*RC-(p[1]-RCY)*RS, RCY+(p[0]-RCX)*RS+(p[1]-RCY)*RC]:p;
    const slabs=[];
    if(nsteps>1){
      for(let k=0;k<nsteps;k++){
        const t=(k+1)/nsteps, a=k/nsteps, zt=z1+(z2-z1)*t;
        if(climb==='-y')      slabs.push([x, y, w, h*(1-a), z1, zt]);
        else if(climb==='+y') slabs.push([x, y+h*a, w, h*(1-a), z1, zt]);
        else if(climb==='-x') slabs.push([x, y, w*(1-a), h, z1, zt]);
        else                  slabs.push([x+w*a, y, w*(1-a), h, z1, zt]);
      }
    } else slabs.push([x,y,w,h,z1,z2]);
    for(const [sx,sy,sw,sh,sz1,sz2] of slabs){
      const c=[[sx,sy],[sx+sw,sy],[sx+sw,sy+sh],[sx,sy+sh]].map(spin);
      face(c.map(q=>project(q[0],q[1],sz2)),true,1);
      for(let i=0;i<4;i++){
        const p0=c[i], p1=c[(i+1)%4];
        const ex=p1[0]-p0[0], ey=p1[1]-p0[1], len=Math.hypot(ex,ey)||1;
        const nx=ey/len, ny=-ex/len;                     // outward wall normal, in plan
        const lit=.30+.70*Math.max(0,nx*LIGHT[0]+ny*LIGHT[1]);
        face([project(p0[0],p0[1],sz1),project(p1[0],p1[1],sz1),
              project(p1[0],p1[1],sz2),project(p0[0],p0[1],sz2)],false,lit);
      }
    }
    // stairs get treads, lifts get a car: recognisable at a glance on the deck.
    // A stepped solid already reads as stairs, so it skips the flat tread marks.
    if((n.type==='stairs'&&!nsteps)||n.type==='lift'){
      const t=tone(n), mark=el('g',{'pointer-events':'none'});
      if(n.type==='stairs'){
        const long=w>=h;
        for(let k=1;k<5;k++){
          const g=k/5;
          const p=long?project(x+w*g,y,z2):project(x,y+h*g,z2);
          const q=long?project(x+w*g,y+h,z2):project(x+w,y+h*g,z2);
          mark.appendChild(el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],
            stroke:t.s,'stroke-width':.9,'stroke-opacity':.75}));
        }
      }else{
        const car=[[x+w*.28,y+h*.28],[x+w*.72,y+h*.28],[x+w*.72,y+h*.72],[x+w*.28,y+h*.72]]
          .map(q=>project(q[0],q[1],z2));
        mark.appendChild(el('polygon',{points:pts(car),fill:'none',
          stroke:t.s,'stroke-width':1,'stroke-opacity':.8}));
      }
      onDeck(f,avgz([[0,0,z2]])+.01,mark);
    }
  }

  if(ROUTE&&ROUTE.length>1){
    for(let i=1;i<ROUTE.length;i++){
      let m=BY[ROUTE[i-1]], n=BY[ROUTE[i]];
      let za=RZ(ROUTE[i-1]), zb=RZ(ROUTE[i]);
      const climb=flr(m)!==flr(n);
      if(climb&&flr(m)>flr(n)){const t1=m;m=n;n=t1;const t2=za;za=zb;zb=t2}   // always draw upward
      const lift=climb&&(m.type==='lift'||n.type==='lift');
      const seg=el('g',{'pointer-events':'none'});
      let shape;
      if(climb&&!lift){
        const N=6, P=[];
        const at=(t,zt)=>[m.xy[0]+(n.xy[0]-m.xy[0])*t, m.xy[1]+(n.xy[1]-m.xy[1])*t, za+(zb-za)*zt];
        for(let k=0;k<N;k++){P.push(at(k/N,k/N)); P.push(at((k+1)/N,k/N)); P.push(at((k+1)/N,(k+1)/N))}
        shape=P.map(v=>project(v[0],v[1],v[2]));
      }else shape=[project(m.xy[0],m.xy[1],za), project(n.xy[0],n.xy[1],zb)];
      const d=pts(shape);
      seg.appendChild(el('polyline',{points:d,fill:'none',stroke:'#04222a',
        'stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round'}));
      seg.appendChild(el('polyline',{points:d,fill:'none',stroke:'#00e5ff',
        'stroke-width':lift?2.2:2.6,'stroke-linecap':'round','stroke-linejoin':'round',
        'stroke-dasharray':lift?'9 120':climb?'5 5':'11 7',
        class:lift?'hoist':climb?'climb':'route'}));
      if(lift) seg.appendChild(el('polyline',{points:d,fill:'none',stroke:'#00e5ff',
        'stroke-width':1,'stroke-opacity':.28,'stroke-dasharray':'1 4'}));
      onDeck(Math.max(flr(m),flr(n)),avgz(shape),seg);   // a climb belongs to the deck it lands on
    }
    ROUTE.forEach((id,i)=>{
      const n=BY[id];
      const q=project(n.xy[0],n.xy[1],RZ(id)), foot=project(n.xy[0],n.xy[1],(flr(n)-1)*LEVEL);
      const end=i===0||i===ROUTE.length-1, g=el('g',{'pointer-events':'none'});
      if(vis(n)) g.appendChild(el('line',{x1:q[0],y1:q[1],x2:foot[0],y2:foot[1],stroke:'#00e5ff',
        'stroke-width':1,'stroke-opacity':.3,'stroke-dasharray':'2 3'}));   // height post
      g.appendChild(el('circle',{cx:q[0],cy:q[1],r:end?5:2.6,
        fill:i===0?'#07090c':'#00e5ff',stroke:'#00e5ff','stroke-width':end?1.6:0}));
      onDeck(flr(n),q[2],g);
    });
  }

  const order = cam.pitch>=0 ? seen : seen.slice().reverse();   // from below, stack the other way
  for(const f of order){
    decks[f].sort((m,n)=>m.z-n.z).forEach(o=>svg.appendChild(o.e));
    above[f].sort((m,n)=>m.z-n.z).forEach(o=>svg.appendChild(o.e));
  }
  orphan.sort((m,n)=>m.z-n.z).forEach(o=>svg.appendChild(o.e));

  // annotations ride above the sort so they stay readable
  // deck tags on the far corner, away from the legend in the bottom-left
  for(const f of seen){
    const tag=project(vw,0,(f-1)*LEVEL);
    if(tag[0]<40||tag[0]>VW-40||tag[1]<14||tag[1]>VH-14) continue;
    svg.appendChild(el('text',{x:tag[0]+10,y:tag[1]+4,'text-anchor':'start','font-size':11,
      'font-weight':600,fill:'#4d6270','letter-spacing':'.16em',
      stroke:'#07090c','stroke-width':4,'paint-order':'stroke'},LEVEL_NAME(f)));
  }
  const hops=[];
  (ROUTE||[]).forEach((id,i)=>{
    const n=BY[id]; if(!n||(n.type!=='stairs'&&n.type!=='lift')) return;
    const prev=i>0?BY[ROUTE[i-1]]:null;
    if(!prev||prev.type!==n.type) hops.push(id);   // climbing seven floors is still one staircase
  });
  for(const id of new Set([HOVER,FROM,TO].concat(hops).filter(Boolean))){
    const n=BY[id]; if(!n) continue;
    const onRoute=ROUTE&&ROUTE.includes(id);
    if(!vis(n)&&!onRoute) continue;      // a route label survives its deck being hidden
    const r=n.svg_rect, q=project(r[0]+r[2]/2,r[1]+r[3]/2,roof(n)+26);
    const on=ROUTE&&ROUTE.includes(id), me=id===HOVER||id===FROM||id===TO;
    svg.appendChild(el('text',{x:q[0],y:q[1],'text-anchor':'middle','font-size':12.5,
      'font-weight':500,fill:!n.passable?'#ff8fa3':on?'#00e5ff':'#e9eef3',
      stroke:'#07090c','stroke-width':4,'paint-order':'stroke','letter-spacing':'.04em'},
      n.name+(me?'  '+LEVEL_NAME(flr(n)):'')));
  }
}

/* ---- view cube ------------------------------------------------------------
   The 123D/Fusion ViewCube: a plain cube with an invisible 3x3 hit grid on
   every face. Nothing is drawn but the six faces — the 26 regions appear only
   on hover, which is why it still reads as a cube.
   The trick is that a region is not a cell. The three corner cells that meet at
   a vertex all carry the same `dir`, so hovering any one lights all three and
   the highlight wraps the corner across all three faces; edge cells pair up the
   same way. That is what makes a vertex a large target on a cube that has no
   visible vertex to aim at.
   A cell's `dir` is both its region key and the direction you fly to, so the
   26 regions and the 26 views cannot drift apart. Clicking a corner lands on a
   true isometric: atan2(1, sqrt2) = 35.26 degrees.
   It shares project()'s rotation maths, so it can never disagree with the scene. */
const CUBE=$('cube'), CH=28,
      B=0.20,        // ponytail: band width as a fraction of the face — the one knob.
                     // Bigger = fatter edge/corner targets, smaller centre plate.
      FACE_NAME={'0+':'E','0-':'W','1+':'S','1-':'N','2+':'TOP','2-':'BTM'}, SG=[1,-1];
let CELLS=null;

// a region is named by whichever axes it leans on: "E", "E–TOP", "E–S–TOP"
const NAME=d=>d.map((v,k)=>v?FACE_NAME[k+(v>0?'+':'-')]:null).filter(Boolean).join('–');
// One fixed light in local space, so every face resolves to its own value and
// the solid cannot read inside-out (Necker flip). Half-lambert keeps the
// away-facing sides visible instead of crushing them to black.
// Opaque, deliberately: a translucent cell stroked in its own translucent colour
// doubles up along every shared edge and the hidden grid shows through as lines.
const MIX=a=>'rgb('+[7+(0-7)*a, 9+(229-9)*a, 12+(255-12)*a].map(Math.round).join(',')+')';
const SHADE=d=>{
  const w=0.5+0.5*(d[0]*0.26+d[1]*0.43+d[2]*0.86)/Math.hypot(d[0],d[1],d[2]);
  return MIX(0.03+0.30*w*w);
};
const HILITE=MIX(0.62);            // one value for every region, so a lit region reads flat

function buildCells(){                              // local-space geometry, built once
  const out=[], S=[-1,-1+2*B,1-2*B,1];              // the four split points along a face axis
  for(let a=0;a<3;a++) for(const sg of SG){
    const u=(a+1)%3, v=(a+2)%3, nrm=[0,0,0]; nrm[a]=sg;
    for(let i=0;i<3;i++) for(let j=0;j<3;j++){
      const poly=[[S[i],S[j]],[S[i+1],S[j]],[S[i+1],S[j+1]],[S[i],S[j+1]]]
        .map(([pu,pv])=>{const q=[0,0,0]; q[a]=sg; q[u]=pu; q[v]=pv; return q});
      // centre cell -> one non-zero (a face); edge cell -> two; corner cell -> three.
      // Cells on different faces that meet at the same edge or corner agree here.
      const dir=[0,0,0]; dir[a]=sg; dir[u]=i-1; dir[v]=j-1;
      out.push({poly,nrm,dir,key:dir.join(',')});
    }
  }
  return out;
}
function cubeProject(x,y,z){                        // project() minus centring and zoom
  const ca=Math.cos(cam.yaw), sa=Math.sin(cam.yaw);
  const rx=x*ca-y*sa, ry=x*sa+y*ca;
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  return [rx*CH, (ry*sp-z*cp)*CH, ry*cp+z*sp];
}
const nearYaw=t=>{let v=t; while(v-cam.yaw>Math.PI)v-=2*Math.PI;
                            while(v-cam.yaw<-Math.PI)v+=2*Math.PI; return v};
// Put `dir` nearest the camera. project()'s depth is (x*sa+y*ca)*cp + z*sp, so the
// direction pointing AT the camera is (sa*cp, ca*cp, sp) — match that and the facet you
// clicked is the one facing you. Negating x and y here (as this did) lands you 180 degrees
// away, staring at the opposite corner.
function flyTo(dir){
  const h=Math.hypot(dir[0],dir[1]);
  aim.yaw = h<1e-6 ? aim.yaw : nearYaw(Math.atan2(dir[0],dir[1]));
  aim.pitch = Math.max(-1.45, Math.min(1.52, Math.atan2(dir[2],h)));
}
// light or unlight a whole region at once — this is the 123D behaviour
const paint=(group,col)=>group.forEach(({cell,rest})=>{
  cell.setAttribute('fill',col||rest); cell.setAttribute('stroke',col||rest)});

function drawCube(){
  if(!CELLS) CELLS=buildCells();
  while(CUBE.firstChild) CUBE.removeChild(CUBE.firstChild);
  const region={};                    // key -> every visible cell of that region
  // a face shows only when its outward normal leans toward the camera
  const vis=CELLS.filter(c=>cubeProject(...c.nrm)[2]>0.02)
                 .map(c=>{const p=c.poly.map(q=>cubeProject(...q));return {c,p,z:avgz(p)}})
                 .sort((m,n)=>m.z-n.z);          // depth grows toward the camera: near paints last
  for(const {c,p} of vis){
    const rest=SHADE(c.nrm);
    // stroke matches fill: the grid is a hit target, not something to look at,
    // and a hairline of its own colour hides the seam between adjacent cells
    const cell=el('polygon',{points:pts(p),fill:rest,stroke:rest,
      'stroke-width':.5,'stroke-linejoin':'round'});
    cell.appendChild(el('title',{},NAME(c.dir)));   // names all 26 regions, no extra UI
    (region[c.key]=region[c.key]||[]).push({cell,rest});
    cell.onpointerenter=()=>{paint(region[c.key],HILITE);
      $('prompt').textContent='VIEW FROM '+NAME(c.dir).split('–').join(' · ')};
    cell.onpointerleave=()=>{paint(region[c.key],null); $('prompt').textContent=HINT};
    cell.onclick=()=>flyTo(c.dir);
    CUBE.appendChild(cell);
  }
  // the cube's own edges, painted over the invisible grid so it reads as a solid
  for(let a=0;a<3;a++) for(const sg of SG){
    const nrm=[0,0,0]; nrm[a]=sg;
    if(cubeProject(...nrm)[2]<=0.02) continue;
    const u=(a+1)%3, v=(a+2)%3;
    const quad=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([pu,pv])=>{
      const q=[0,0,0]; q[a]=sg; q[u]=pu; q[v]=pv; return cubeProject(...q)});
    CUBE.appendChild(el('polygon',{points:pts(quad),fill:'none',stroke:'#00e5ff',
      'stroke-width':1.1,'stroke-linejoin':'round','pointer-events':'none'}));
    const m=cubeProject(...nrm);
    CUBE.appendChild(el('text',{x:m[0],y:m[1]+3.4,'text-anchor':'middle','font-size':9,
      'font-weight':600,fill:'#00e5ff','letter-spacing':'.12em','pointer-events':'none'},
      NAME(nrm)));
  }
}

/* ---- readout ---- */
function readRoute(r){
  const b=$('read');
  b.innerHTML='<p class="k">Route</p>';
  if(!r){b.insertAdjacentHTML('beforeend','<p class="void">No route traced.</p>');return}
  if(!r.path.length){
    b.insertAdjacentHTML('beforeend','<div class="err">'+esc(r.reason||'No passable path.')+'</div>');return}

  const cum=walked(r.path), lv=r.path.map(id=>flr(BY[id])), span=[...new Set(lv)].sort();
  b.insertAdjacentHTML('beforeend',
    '<div class="hdr"><span class="dist">'+r.distance_m+'<s>M</s></span>'+
    '<span class="meta">'+r.steps.length+' steps · '+
      (span.length>2?LEVEL_NAME(span[0])+' → '+LEVEL_NAME(span[span.length-1])
        :span.length>1?LEVEL_NAME(span[0])+' → '+LEVEL_NAME(span[1])
        :LEVEL_NAME(span[0]))+'</span></div>'+
    profile(cum,lv,span,Math.max(220,Math.round(b.clientWidth-36)))+
    r.steps.map((s,i)=>{
      const n=BY[r.path[i]], t=n?n.type:'', last=i===r.steps.length-1;
      const climb=i>0&&lv[i]!==lv[i-1];
      return '<div class="stp'+(climb?' up':'')+(last?' end':'')+'" data-t="'+t+'">'+
             '<span class="g"><i></i></span><span>'+esc(s)+'</span>'+
             '<span class="at">'+(last?r.distance_m+' m':cum[i]?cum[i]+' m':'start')+'</span></div>';
    }).join(''));
  const bl=ST.nodes.filter(n=>!n.passable);
  if(bl.length) b.insertAdjacentHTML('beforeend',
    bl.map(n=>'<div class="blk">✕ '+esc(n.name)+' blocked</div>').join(''));
}

// cumulative metres at each node, read off the same edge list the server routed over
function walked(path){
  const out=[0];
  for(let i=1;i<path.length;i++){
    const e=ST.edges.find(e=>(e.a===path[i-1]&&e.b===path[i])||(e.b===path[i-1]&&e.a===path[i]));
    out.push(out[i-1]+(e?e.distance:0));
  }
  return out;
}

function profile(cum,lv,span,W){
  const H=span.length>3?72:54, L=23, R=W-8, total=cum[cum.length-1]||1;
  const lo=span[0], hi=span[span.length-1];
  const yOf=f=>span.length<2?H/2:H-14-((f-lo)/(hi-lo))*(H-30);
  const xOf=d=>L+(d/total)*(R-L);
  let g='';
  for(const f of span){                       // one hairline per level, labelled
    const y=yOf(f);
    g+='<line x1="'+L+'" y1="'+y+'" x2="'+R+'" y2="'+y+'" stroke="#18222b" stroke-width="1"/>'+
       '<text x="1" y="'+(y+3)+'" fill="#3f4e58" font-size="7.5" letter-spacing=".06em">'+LVL(f)+'</text>';
  }
  const pts=cum.map((d,i)=>xOf(d).toFixed(1)+','+yOf(lv[i]).toFixed(1)).join(' ');
  g+='<polyline points="'+pts+'" fill="none" stroke="#00e5ff" stroke-width="1.6" '+
     'stroke-linejoin="round" stroke-linecap="round"/>';
  cum.forEach((d,i)=>{
    const x=xOf(d), y=yOf(lv[i]), end=i===0||i===cum.length-1;
    g+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(end?3.2:1.7)+'" '+
       'fill="'+(i===0?'#07090c':'#00e5ff')+'" stroke="#00e5ff" stroke-width="'+(end?1.4:0)+'"/>';
  });
  // viewBox matches the rendered box, so nothing is scaled and the type stays sharp
  return '<svg class="prof" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>';
}

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---- data ---- */
async function loadState(){
  ST=await (await fetch(API.state)).json();
  BY=Object.fromEntries(ST.nodes.map(n=>[n.id,n]));
  const [,,vw,vh]=ST.svg_viewbox; CX=vw/2; CY=vh/2;
  const floors=[...new Set(ST.nodes.map(flr))].sort((a,b)=>a-b);
  // seven decks at two-storey spacing would not fit the frame
  LEVEL = floors.length<=2 ? 340 : Math.max(110, Math.round(1150/floors.length));
  const span=floors.length>2 ? LVL(floors[0])+'–'+LVL(floors[floors.length-1]) : floors.map(LVL).join('/');
  $('bld').textContent=ST.building.toUpperCase()+'  ·  '+span+'  ·  '+ST.nodes.length+' SPACES';
  for(const id of ['from','to','blk']){
    const s=$(id), keep=s.value;
    s.innerHTML='';
    if(id!=='blk') s.appendChild(new Option('— none —',''));
    ST.nodes.forEach(n=>s.appendChild(new Option(n.name+' · '+LVL(flr(n)),n.id)));
    if(keep&&BY[keep]) s.value=keep;
    else if(id!=='blk'&&keep==='') s.value='';   // blk has no blank option to fall back to
  }
  if(!seeded){
    const ent=ST.nodes.find(n=>n.type==='entrance')||ST.nodes[0];
    // "toilets on the first floor" is a poor thing to greet someone with
    const good=ST.nodes.filter(n=>n.type==='room'&&!DULL.test(n.name));
    const far=good.slice().sort((a,b)=>flr(b)-flr(a))[0]||ST.nodes[ST.nodes.length-1];
    FROM=ent.id; TO=far.id; $('from').value=FROM; $('to').value=TO; seeded=true;
  }
  if(!show.size) floors.forEach(f=>show.add(f));
  const seg=$('lvl');
  if(!seg.children.length){
    seg.appendChild(mkSeg('All','all'));
    floors.forEach(f=>seg.appendChild(mkSeg(LVL(f),String(f))));
    markSeg();
  }
  dirty=true;
}
function mkSeg(label,v){
  const b=document.createElement('button'); b.textContent=label; b.dataset.v=v;
  b.title = v==='all' ? 'Show every deck' : 'Toggle this deck';
  b.onclick=e=>{
    const floors=[...new Set(ST.nodes.map(flr))];
    if(v==='all'){
      // "All" is a real toggle: every deck on, or every deck off
      if(show.size===floors.length) show.clear();
      else floors.forEach(f=>show.add(f));
    }else{
      const f=+v;
      // alt/ctrl-click isolates one deck; a plain click just flips it
      if(e.altKey||e.ctrlKey||e.metaKey){ show=new Set([f]) }
      else if(show.has(f)){ if(show.size===1) return; show.delete(f) }   // never blank the view
      else show.add(f);
    }
    markSeg(); fitView(); dirty=true;
  };
  return b;
}
function markSeg(){
  const floors=[...new Set(ST.nodes.map(flr))];
  for(const b of $('lvl').children)
    b.classList.toggle('on', b.dataset.v==='all' ? show.size===floors.length : show.has(+b.dataset.v));
}

async function trace(from,to,acc){
  const q=new URLSearchParams({from,to,accessible:!!acc});
  const r=await (await fetch(API.route+'?'+q)).json();
  LASTR={from,to,accessible:!!acc};
  ROUTE=r.path; readRoute(r); dirty=true;
  return r;
}
const accOn=()=>$('acc').dataset.on==='1';

$('go').onclick=()=>{
  FROM=$('from').value; TO=$('to').value;
  if(!FROM||!TO){ $('read').innerHTML='<p class="k">Route</p>'+
    '<p class="void">Pick a start and a destination — or click two spaces on the model.</p>'; return }
  trace(FROM,TO,accOn());
};
$('swap').onclick=()=>{const a=$('from').value;$('from').value=$('to').value;$('to').value=a;
  FROM=$('from').value;TO=$('to').value;dirty=true};
$('acc').onclick=e=>{const on=e.target.dataset.on==='1';e.target.dataset.on=on?'0':'1';
  e.target.classList.toggle('on',!on)};
$('from').onchange=e=>{FROM=e.target.value;dirty=true};
$('to').onchange=e=>{TO=e.target.value;dirty=true};
async function setPassable(ids, passable){
  for(const id of ids)
    await fetch(API.block+'?node='+encodeURIComponent(id)+'&passable='+passable,{method:'POST'});
  await loadState();
  if(LASTR) await trace(LASTR.from,LASTR.to,LASTR.accessible); else dirty=true;
}
function note(msg){                      // Block and Clear used to change things in silence
  const b=$('read'), p=document.createElement('p');
  p.className='void'; p.textContent=msg;
  const old=b.querySelector('.note'); if(old) old.remove();
  p.classList.add('note'); b.appendChild(p);
}
$('block').onclick=async()=>{
  const id=$('blk').value; if(!id) return;
  await setPassable([id], false);
  note(BY[id].name+' is now blocked.');
};
// Clear lifts EVERY blockage. Scoping it to the dropdown meant it silently did
// nothing unless you had re-selected the exact space you blocked.
$('clear').onclick=async()=>{
  const blocked=ST.nodes.filter(n=>!n.passable).map(n=>n.id);
  if(!blocked.length){ note('Nothing is blocked.'); return }
  await setPassable(blocked, true);
  note(blocked.length===1 ? 'Cleared 1 blockage.' : 'Cleared '+blocked.length+' blockages.');
};

/* ---- camera input ---- */
$('home').onclick=resetView;
// a cube only ever shows three faces; these reach the other three, exactly as
// the rotate arrows do in Fusion/123D
$('rotL').onclick=()=>{aim.yaw-=Math.PI/2};
$('rotR').onclick=()=>{aim.yaw+=Math.PI/2};

// Orbit direction, one flag per axis. Default on both: the model follows the
// cursor — drag right and the near face travels right, drag down and the roof tips
// toward you, as if you had grabbed the building. Turning one off restores the older
// camera-orbit feel on that axis alone.
// ponytail: only the drag direction flips. Pitch keeps its [-1.45,1.52] clamp, so the
// reachable range is unchanged and render()'s deck flip at cam.pitch<0 is unaffected.
// X keeps the original storage key so an existing preference survives the split.
let INVX = localStorage.getItem('holo.invertOrbit') !== '0';
let INVY = localStorage.getItem('holo.invertPitch') !== '0';
const setInv = (id, key, v) => { localStorage.setItem(key, v ? '1' : '0');
  const b = $(id); b.setAttribute('aria-pressed', String(v));
  b.title = b.dataset.ax + ' drag: ' + (v ? 'follows the model' : 'orbits the camera'); };
setInv('invX','holo.invertOrbit',INVX); setInv('invY','holo.invertPitch',INVY);
$('invX').onclick = () => setInv('invX','holo.invertOrbit', INVX = !INVX);
$('invY').onclick = () => setInv('invY','holo.invertPitch', INVY = !INVY);

let drag=null;
stage.addEventListener('pointerdown',e=>{
  // HUD controls sit inside the stage: capturing the pointer here stole their
  // click, which is why the view buttons looked dead.
  if(e.target.closest('.hud')) return;
  drag={x:e.clientX,y:e.clientY,sh:e.shiftKey,moved:0,id:e.target.dataset&&e.target.dataset.id};
  stage.classList.add('drag'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  // if the pointerup went missing (alt-tab, pointer left the window) the drag
  // would otherwise stick and the camera would orbit on every later move
  if(drag&&e.buttons===0){drag=null; stage.classList.remove('drag')}
  if(!drag){
    if(e.target.closest('.hud')) return;   // HUD controls write their own #prompt text
    const id=e.target.dataset&&e.target.dataset.id||null;
    if(id!==HOVER){HOVER=id; stage.classList.toggle('hot',!!id); dirty=true;
      $('prompt').textContent=id?BY[id].name.toUpperCase()+'  ·  click to set '+PICK:HINT}
    return;
  }
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.x=e.clientX; drag.y=e.clientY; drag.moved+=Math.abs(dx)+Math.abs(dy);
  if(drag.sh){aim.ox+=dx; aim.oy+=dy}
  else{aim.yaw+=(INVX?-1:1)*dx*0.007; aim.pitch=Math.max(-1.45,Math.min(1.52,aim.pitch-(INVY?-1:1)*dy*0.006))}
});
addEventListener('pointercancel',()=>{drag=null;stage.classList.remove('drag')});
addEventListener('pointerup',()=>{
  if(drag&&drag.moved<5&&drag.id) pickNode(drag.id);
  drag=null; stage.classList.remove('drag');
});
stage.addEventListener('wheel',e=>{e.preventDefault();
  aim.scale=Math.max(0.35,Math.min(2.6,aim.scale*(1-e.deltaY*0.0013)))},{passive:false});

function pickNode(id){
  if(PICK==='from'){FROM=id; $('from').value=id; PICK='to'}
  else{TO=id; $('to').value=id; PICK='from'; trace(FROM,TO,accOn())}
  $('prompt').textContent=BY[id].name.toUpperCase()+'  ·  click to set '+PICK;
  dirty=true;
}

/* ---- chat ---- */
const log=$('log'), input=$('ci'), chips=$('chips');
let HINTS=[];   // written from the loaded building, so they never name another site
let TURNS=[], busy=false;

function say(who,text,cls){
  const d=document.createElement('div');
  d.className='msg '+(who==='you'?'u':'a')+(cls?' '+cls:'');
  d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}

async function ask(text){
  text=text.trim(); if(!text||busy) return;
  busy=true; input.value=''; chips.hidden=true;
  say('you',text); TURNS.push('visitor: '+text);
  const wait=say('bot','reading the model…','wait');
  let r;
  try{
    const res=await fetch(API.chat,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,history:TURNS.slice(-7,-1).join('\n')})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    r=await res.json();
  }catch(err){wait.remove(); say('bot','Could not reach the building service — '+err.message,'err');
    busy=false; return}
  wait.remove();

  if(r.req){LASTR=r.req; FROM=r.req.from; TO=r.req.to;
    $('from').value=r.req.from; $('to').value=r.req.to;
    $('acc').dataset.on=r.req.accessible?'1':'0';
    $('acc').classList.toggle('on',!!r.req.accessible)}
  if(r.route){ROUTE=r.route.path; readRoute(r.route)}
  if(r.level){   // "show me level 2" isolates it; "show everything" turns them all on
    const floors=[...new Set(ST.nodes.map(flr))];
    show = r.level==='all' ? new Set(floors) : new Set([+r.level]);
    markSeg(); fitView();
  }
  if(r.action==='reset_view') resetView();
  if(r.changed&&r.changed.length){await loadState(); if(LASTR) await trace(LASTR.from,LASTR.to,LASTR.accessible)}
  dirty=true;
  say('bot',r.reply); TURNS.push('system: '+r.reply);
  busy=false;
}
$('cf').onsubmit=e=>{e.preventDefault();ask(input.value)};

const HINT='drag to orbit · scroll to zoom · shift-drag to pan';
addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  // mid-sentence in the chat box, Escape belongs to the sentence
  if(document.activeElement===input&&input.value){input.value=''; return}
  ROUTE=null; LASTR=null; FROM=null; TO=null; PICK='from'; HOVER=null;
  $('from').value=''; $('to').value='';
  readRoute(null);
  $('prompt').textContent=HINT;
  stage.classList.remove('hot');
  dirty=true;
});
function buildHints(){
  const pick=(f,skip)=>ST.nodes.find(n=>f(n)&&n.name!==skip);
  const fine=n=>n.type==='room'&&!DULL.test(n.name);
  const up  = ST.nodes.filter(fine).sort((a,b)=>flr(b)-flr(a))[0] || pick(n=>n.type==='room');
  const room= pick(n=>fine(n)&&flr(n)===1, up&&up.name) || pick(fine, up&&up.name);
  const ent = pick(n=>n.type==='entrance') || ST.nodes[0];
  const way = pick(n=>n.type==='stairs'||n.type==='lift');
  HINTS=[
    up   && 'Take me to the '+up.name+', step-free',
    room && ent && 'How do I reach the '+room.name+' from the '+ent.name+'?',
    way  && 'The '+way.name+' is shut for repairs',
  ].filter(Boolean);
  chips.textContent='';
  HINTS.forEach(h=>{const b=document.createElement('button');
    b.type='button'; b.className='chip'; b.textContent=h; b.onclick=()=>ask(h); chips.appendChild(b)});
}
say('bot','Ask where you want to go, or tell me a space is blocked.');

// the server says which twins are mounted, so no guessing and no 404 probe
(async()=>{
  let list=[]; try{ list=await (await fetch('/twins')).json() }catch{ return }
  const other=list.find(t=>t.prefix!==BASE);
  if(!other) return;
  const a=$('alt'); a.href=other.prefix;
  const short=n=>{
    const p=n.match(/\(([A-Z][A-Z0-9]{1,7})\)/); if(p) return p[1];
    const w=n.replace(/\(.*?\)/g,'').split(/[\s,]+/).filter(x=>/^[A-Za-z]/.test(x));
    // both buildings start "KJSSE", so an all-caps leading org word is not the name
    if(w[0]&&/^[A-Z0-9]{3,8}$/.test(w[0])&&w[1]) return w[1];  // "KJSSE Bhaskaracharya..." -> Bhaskaracharya
    if(w[0]&&/^[A-Z0-9]{3,8}$/.test(w[0])) return w[0];
    return w.length>=3 ? w.map(x=>x[0].toUpperCase()).join('').slice(0,5) : w.join(' ').slice(0,12);
  };
  a.textContent=short(other.name);
  a.title='Switch to '+other.name; a.hidden=false;
})();

loadState().then(()=>{buildHints(); resetView(); cam={...aim}; tick()});
</script>
