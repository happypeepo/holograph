<!doctype html>
<meta charset="utf-8">
<title>Spatial Twin — Holographic View</title>
<style>
:root{ --cy:#5eead4; --cy2:#22d3ee; --red:#ff4d6d; --bg:#03080e; --ink:#dff7f4; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden;
     display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:baseline;gap:18px;padding:14px 22px;border-bottom:1px solid #0e2a33;background:linear-gradient(180deg,#06131b,#03080e)}
h1{margin:0;font-size:24px;letter-spacing:.5px;color:#fff}
.bld{font-size:18px;color:var(--cy)}
.note{font-size:12px;color:#5b8a92;font-style:italic}
.spacer{flex:1}
a.b2d{color:var(--cy2);text-decoration:none;border:1px solid #164e5b;padding:7px 14px;border-radius:7px;font-size:14px}
a.b2d:hover{background:#0b2028}
main{display:grid;grid-template-columns:1fr 400px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden;cursor:grab}
#stage.drag{cursor:grabbing}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(94,234,212,.05) 0 1px,transparent 1px 4px)}
svg{width:100%;height:100%;display:block}
aside{border-left:1px solid #0e2a33;background:#04101a;min-height:0;display:flex;flex-direction:column}
#scroll{padding:18px 18px 4px;overflow:auto;flex:0 1 auto;max-height:52%}
.k{font-size:11px;letter-spacing:2px;color:#4f818b;text-transform:uppercase;margin:0 0 8px}
.dist{font-size:40px;font-weight:800;color:var(--cy);line-height:1;margin:2px 0 6px}
.via{font-size:13px;color:#4f818b;margin:0 0 14px}
ol{margin:0 0 20px;padding-left:24px}
ol li{margin:7px 0;font-size:16px}
ol li.up{color:var(--cy2);font-weight:700}
.blocked{color:var(--red);font-weight:700;font-size:16px;margin:4px 0}
.reason{color:var(--red);font-size:16px;border-left:3px solid var(--red);padding-left:12px;margin-bottom:18px}
.leg{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:13px;color:#8fb6bc}
.sw{width:15px;height:15px;border-radius:3px;border:1px solid}
button,input{background:#0a1f28;color:var(--ink);border:1px solid #164e5b;border-radius:7px;padding:9px 12px;font-size:15px;font-family:inherit}
button{cursor:pointer}
button:hover{background:#12333d;border-color:var(--cy)}
button.go{background:#0d3b44;border-color:var(--cy);color:#fff;font-weight:700}
text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;paint-order:stroke;stroke:#03080e;stroke-width:4px;stroke-linejoin:round}
#chat{flex:1 1 auto;min-height:250px;display:flex;flex-direction:column;
  border-top:1px solid #0e2a33;background:#051520;padding:14px 18px 16px}
#log{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:11px;font-size:15px;line-height:1.4;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:#0d3b44;border:1px solid #175c6b;color:#fff;border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:#0a1f28;border:1px solid #123c47;border-bottom-left-radius:3px}
.msg.a.err{border-color:#7f2740;color:#ff90a4}
.msg.wait{color:#4f818b;font-style:italic}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
#chips[hidden]{display:none}   /* an explicit display: beats the hidden attribute */
.chip{background:#08222b;border:1px solid #12414d;color:#7fc9d3;border-radius:14px;padding:5px 11px;
  font-size:12.5px;cursor:pointer;font-family:inherit;text-align:left}
.chip:hover{background:#0e3540;border-color:var(--cy);color:#fff}
#cf{display:flex;gap:8px}
#ci{flex:1;min-width:0}
#ci:focus{outline:none;border-color:var(--cy)}
button.lnk{background:none;border:none;padding:0;font-size:13px;color:var(--cy2);cursor:pointer;
  text-decoration:underline;font-family:inherit}
@keyframes march{to{stroke-dashoffset:-40}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.route{animation:march 1.1s linear infinite}
.pulse{animation:pulse 1.5s ease-in-out infinite}
</style>

<header>
  <h1>Spatial Twin</h1>
  <span class="bld" id="bld">loading…</span>
  <span class="note">illustrative approximation — not a survey drawing</span>
  <span class="spacer"></span>
  <a class="b2d" href="/">← 2D plan</a>
</header>

<main>
  <div id="stage"><svg id="svg" viewBox="0 0 1400 780" preserveAspectRatio="xMidYMid meet"></svg></div>
  <aside>
    <div id="scroll">
      <p class="k">Route</p>
      <div id="out"><p style="color:#4f818b">Ask for directions below.</p></div>
      <p class="k">Legend</p>
      <div class="leg"><span class="sw" style="background:rgba(94,234,212,.22);border-color:#5eead4"></span>space</div>
      <div class="leg"><span class="sw" style="background:rgba(34,211,238,.35);border-color:#22d3ee"></span>on route</div>
      <div class="leg"><span class="sw" style="background:rgba(255,77,109,.3);border-color:#ff4d6d"></span>blocked</div>
      <div class="leg"><span class="sw" style="border-color:#22d3ee;background:none;border-style:dashed"></span>stair / lift shaft</div>
      <div class="leg" style="margin-top:14px;color:#4f818b">drag to orbit · scroll to zoom · shift-drag to pan ·
        <button class="lnk" id="reset">reset view</button></div>
    </div>
    <div id="chat">
      <p class="k">Ask</p>
      <div id="log"></div>
      <div id="chips"></div>
      <form id="cf" autocomplete="off">
        <input id="ci" placeholder="Where do you want to go?" aria-label="Ask about the building">
        <button class="go" type="submit">Send</button>
      </form>
    </div>
  </aside>
</main>

<script>
const API = { state:'/3d/state', route:'/3d/route', block:'/3d/block' };
const HGT = { room:92, corridor:30, stairs:74, lift:132, entrance:56 };
const LEVEL = 360;                       // vertical separation between levels, in plan units
const VW = 1400, VH = 780;
const DEFCAM = {yaw:-0.5,pitch:0.90,scale:0.82,ox:0,oy:104};
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
const el = (t,a,tx)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(tx!=null)e.textContent=tx;return e};

let ST=null, BY={}, ROUTE=null, show='all', cam={...DEFCAM};
let CX=0, CY=0;

const flr  = n => n.floor||1;
const base = n => (flr(n)-1)*LEVEL;
const vis  = n => show==='all' || String(flr(n))===show;

function project(x,y,z){
  const dx=x-CX, dy=y-CY;
  const ca=Math.cos(cam.yaw), sa=Math.sin(cam.yaw);
  const rx=dx*ca-dy*sa, ry=dx*sa+dy*ca;
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  return [ VW/2+cam.ox+rx*cam.scale,
           VH/2+cam.oy+(ry*sp-z*cp)*cam.scale,
           ry*cp+z*sp ];
}
const avgz = p => p.reduce((s,q)=>s+q[2],0)/p.length;
const pts  = p => p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');

function palette(n){
  if(!n.passable)                    return {s:'#ff4d6d', f:'rgba(255,77,109,', t:.30};
  if(ROUTE && ROUTE.includes(n.id))  return {s:'#22d3ee', f:'rgba(34,211,238,',  t:.34};
  return {s:'#5eead4', f:'rgba(94,234,212,', t:.16};
}

function render(){
  if(!ST) return;
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const [,,vw,vh] = ST.svg_viewbox;
  const floors = [...new Set(ST.nodes.map(flr))].sort();

  // one ground grid per level, fainter as you go up
  for(const f of floors){
    if(!(show==='all'||String(f)===show)) continue;
    const z=(f-1)*LEVEL, g=el('g',{opacity:f===1?'.28':'.15'});
    for(let x=0;x<=vw;x+=100){ const a=project(x,0,z), b=project(x,vh,z);
      g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#125561','stroke-width':1})); }
    for(let y=0;y<=vh;y+=100){ const a=project(0,y,z), b=project(vw,y,z);
      g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#125561','stroke-width':1})); }
    svg.appendChild(g);
  }

  // stair / lift shafts: any edge whose endpoints sit on different levels
  if(show==='all') for(const e of ST.edges){
    const a=BY[e.a], b=BY[e.b];
    if(!a||!b||flr(a)===flr(b)) continue;
    const lo=flr(a)<flr(b)?a:b, hi=lo===a?b:a;
    const p1=project(lo.xy[0],lo.xy[1],base(lo)+(HGT[lo.type]||40));
    const p2=project(hi.xy[0],hi.xy[1],base(hi));
    svg.appendChild(el('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],
      stroke:e.accessible?'#22d3ee':'#7dd3fc','stroke-width':2.2,
      'stroke-dasharray':e.accessible?'none':'7 5','stroke-opacity':e.passable?.75:.2}));
  }

  // every face of every visible volume, painter-sorted
  const faces=[];
  for(const n of ST.nodes){
    if(!vis(n)) continue;
    const [x,y,w,h]=n.svg_rect, z1=base(n), z2=z1+(HGT[n.type]||40);
    const c=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
    faces.push({p:c.map(q=>project(q[0],q[1],z2)), n, top:true});
    for(let i=0;i<4;i++){
      const a=c[i], b=c[(i+1)%4];
      faces.push({p:[project(a[0],a[1],z1),project(b[0],b[1],z1),project(b[0],b[1],z2),project(a[0],a[1],z2)], n, top:false});
    }
  }
  faces.sort((a,b)=>avgz(a.p)-avgz(b.p));
  for(const f of faces){
    const c=palette(f.n), op=f.top?c.t:c.t*0.45;
    svg.appendChild(el('polygon',{points:pts(f.p), fill:c.f+op+')', stroke:c.s,
      'stroke-width':f.top?1.6:0.9, 'stroke-opacity':f.top?0.95:0.5,
      class: f.n.passable?'':'pulse'}));
  }

  // route floats above the volumes, drawn in full even when a level is filtered out
  if(ROUTE && ROUTE.length>1){
    const rp = ROUTE.map(id=>{const n=BY[id]; return project(n.xy[0],n.xy[1],base(n)+(HGT[n.type]||40)+16)});
    svg.appendChild(el('polyline',{points:pts(rp),fill:'none',stroke:'#0e7490','stroke-width':9,
      'stroke-linejoin':'round','stroke-linecap':'round','stroke-opacity':.5}));
    svg.appendChild(el('polyline',{points:pts(rp),fill:'none',stroke:'#67e8f9','stroke-width':3.5,
      'stroke-dasharray':'14 8','stroke-linejoin':'round','stroke-linecap':'round',class:'route'}));
    rp.forEach((q,i)=>svg.appendChild(el('circle',{cx:q[0],cy:q[1],r:i===0||i===rp.length-1?7:4,
      fill:i===0?'#4ade80':i===rp.length-1?'#67e8f9':'#0e7490',stroke:'#03080e','stroke-width':2})));
  }

  // screen-aligned labels last
  for(const n of ST.nodes){
    if(!vis(n)) continue;
    const [x,y,w,h]=n.svg_rect, z=base(n)+(HGT[n.type]||40)+8;
    const q=project(x+w/2,y+h/2,z);
    svg.appendChild(el('text',{x:q[0],y:q[1],'text-anchor':'middle','font-size':15,
      fill:n.passable?'#dff7f4':'#ff90a4','font-weight':600}, n.name));
  }
}

function panel(r){
  const o=document.getElementById('out');
  if(!r){o.innerHTML='<p style="color:#4f818b">Pick a start and destination below.</p>';return}
  if(!r.path.length){o.innerHTML='<div class="reason">'+(r.reason||'No route.')+'</div>';return}
  const lv=[...new Set(r.path.map(id=>flr(BY[id])))].sort();
  o.innerHTML='<div class="dist">'+r.distance_m+' m</div>'+
    '<p class="via">'+(lv.length>1?'crosses level '+lv.join(' → '):'level '+lv[0])+'</p><ol>'+
    r.steps.map((s,i)=>{
      const t=BY[r.path[i]] ? BY[r.path[i]].type : '';
      const up=(t==='stairs'||t==='lift');
      return '<li class="'+(up?'up':'')+'">'+s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</li>';
    }).join('')+'</ol>';
  const bl=ST.nodes.filter(n=>!n.passable);
  if(bl.length) o.innerHTML+='<p class="k">Blocked</p>'+bl.map(n=>'<div class="blocked">✕ '+n.name+'</div>').join('');
}

async function loadState(){
  ST = await (await fetch(API.state)).json();
  BY = Object.fromEntries(ST.nodes.map(n=>[n.id,n]));
  const [,,vw,vh]=ST.svg_viewbox; CX=vw/2; CY=vh/2;
  const floors=[...new Set(ST.nodes.map(flr))].sort();
  document.getElementById('bld').textContent =
    ST.building+' · level'+(floors.length>1?'s '+floors[0]+'–'+floors[floors.length-1]:' '+floors[0])+
    ' · '+ST.nodes.length+' spaces';
  render();
}

/* ---------------- chat ----------------
   The page sends a sentence and gets back a command the server has already
   executed. Every path, distance and step in here came from networkx. */
const log=document.getElementById('log'), input=document.getElementById('ci');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const HINTS=["Take me to the GM's office, step-free",
             "How do I reach platform 1 from the booking hall?",
             "The grand staircase is shut for repairs",
             "Show me level 2"];
let TURNS=[];    // recent turns, replayed to the model so "take me there too" resolves
let LAST=null;   // last route the server resolved, re-run whenever a blockage changes
let busy=false;

function say(who,text,cls){
  const d=document.createElement('div');
  d.className='msg '+(who==='you'?'u':'a')+(cls?' '+cls:'');
  d.textContent=text;
  log.appendChild(d); log.scrollTop=log.scrollHeight;
  return d;
}

async function replay(){
  const q=new URLSearchParams({from:LAST.from,to:LAST.to,accessible:LAST.accessible});
  const r=await (await fetch(API.route+'?'+q)).json();
  ROUTE=r.path; panel(r);
}

async function ask(text){
  text=text.trim();
  if(!text||busy) return;
  busy=true; input.value=''; chips.hidden=true;
  say('you',text); TURNS.push('visitor: '+text);
  const wait=say('bot','thinking…','wait');
  let r;
  try{
    const res=await fetch('/3d/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text, history:TURNS.slice(-7,-1).join('\n')})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    r=await res.json();
  }catch(err){
    wait.remove(); say('bot','Could not reach the building service — '+err.message,'err');
    busy=false; return;
  }
  wait.remove();

  if(r.req)   LAST=r.req;
  if(r.route){ ROUTE=r.route.path; panel(r.route); }
  if(r.level) show=r.level;
  if(r.action==='reset_view') cam={...DEFCAM};
  if(r.changed && r.changed.length){ await loadState(); if(LAST) await replay(); }
  render();
  say('bot',r.reply); TURNS.push('system: '+r.reply);
  busy=false;
}

document.getElementById('cf').onsubmit=e=>{e.preventDefault();ask(input.value)};
document.getElementById('reset').onclick=()=>{cam={...DEFCAM};render()};
const chips=document.getElementById('chips');
HINTS.forEach(h=>{const b=document.createElement('button');
  b.type='button'; b.className='chip'; b.textContent=h; b.onclick=()=>ask(h); chips.appendChild(b)});
say('bot','Ask me where you want to go, or tell me a space is blocked.');


const stage=document.getElementById('stage');
let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sh:e.shiftKey};stage.classList.add('drag');stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(drag.sh){ cam.ox+=dx; cam.oy+=dy; }
  else { cam.yaw+=dx*0.006; cam.pitch=Math.max(0.16,Math.min(1.50,cam.pitch-dy*0.005)); }
  render();
});
addEventListener('pointerup',()=>{drag=null;stage.classList.remove('drag')});
stage.addEventListener('wheel',e=>{e.preventDefault();
  cam.scale=Math.max(0.35,Math.min(2.4,cam.scale*(1-e.deltaY*0.0012)));render()},{passive:false});

loadState();
</script>
