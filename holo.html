<!doctype html>
<meta charset="utf-8">
<title>Spatial Twin — Holographic View</title>
<style>
:root{ --cy:#5eead4; --cy2:#22d3ee; --red:#ff4d6d; --amb:#fbbf24; --bg:#03080e; --ink:#dff7f4; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden;
     display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:baseline;gap:18px;padding:14px 22px;border-bottom:1px solid #0e2a33;background:linear-gradient(180deg,#06131b,#03080e)}
h1{margin:0;font-size:24px;letter-spacing:.5px;color:#fff}
.bld{font-size:18px;color:var(--cy)}
.note{font-size:12px;color:#5b8a92;font-style:italic}
.spacer{flex:1}
a.b2d{color:var(--cy2);text-decoration:none;border:1px solid #164e5b;padding:7px 14px;border-radius:7px;font-size:14px}
a.b2d:hover{background:#0b2028}
main{display:grid;grid-template-columns:1fr 400px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden;cursor:grab}
#stage.drag{cursor:grabbing}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(94,234,212,.05) 0 1px,transparent 1px 4px)}
svg{width:100%;height:100%;display:block}
aside{border-left:1px solid #0e2a33;padding:18px;overflow:auto;background:#04101a}
.k{font-size:11px;letter-spacing:2px;color:#4f818b;text-transform:uppercase;margin:0 0 8px}
.dist{font-size:40px;font-weight:800;color:var(--cy);line-height:1;margin:2px 0 14px}
ol{margin:0 0 20px;padding-left:24px}
ol li{margin:7px 0;font-size:16px}
.blocked{color:var(--red);font-weight:700;font-size:16px;margin:4px 0}
.reason{color:var(--red);font-size:16px;border-left:3px solid var(--red);padding-left:12px;margin-bottom:18px}
.leg{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:13px;color:#8fb6bc}
.sw{width:15px;height:15px;border-radius:3px;border:1px solid}
footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 22px;border-top:1px solid #0e2a33;background:#06131b}
label{font-size:12px;color:#6d9aa2;letter-spacing:1px;text-transform:uppercase}
select,button{background:#0a1f28;color:var(--ink);border:1px solid #164e5b;border-radius:7px;padding:9px 12px;font-size:15px;font-family:inherit}
button{cursor:pointer}
button:hover{background:#12333d;border-color:var(--cy)}
button.go{background:#0d3b44;border-color:var(--cy);color:#fff;font-weight:700}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--cy)}
.chk{display:flex;align-items:center;gap:7px}
text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;paint-order:stroke;stroke:#03080e;stroke-width:4px;stroke-linejoin:round}
@keyframes march{to{stroke-dashoffset:-40}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.route{animation:march 1.1s linear infinite}
.pulse{animation:pulse 1.5s ease-in-out infinite}
</style>

<header>
  <h1>Spatial Twin</h1>
  <span class="bld" id="bld">loading…</span>
  <span class="note">illustrative approximation — not a survey drawing</span>
  <span class="spacer"></span>
  <a class="b2d" href="/">← 2D plan</a>
</header>

<main>
  <div id="stage"><svg id="svg" viewBox="0 0 1400 780" preserveAspectRatio="xMidYMid meet"></svg></div>
  <aside>
    <p class="k">Route</p>
    <div id="out"><p style="color:#4f818b">Pick a start and destination below.</p></div>
    <p class="k">Legend</p>
    <div class="leg"><span class="sw" style="background:rgba(94,234,212,.22);border-color:#5eead4"></span>space</div>
    <div class="leg"><span class="sw" style="background:rgba(34,211,238,.35);border-color:#22d3ee"></span>on route</div>
    <div class="leg"><span class="sw" style="background:rgba(255,77,109,.3);border-color:#ff4d6d"></span>blocked</div>
    <div class="leg" style="margin-top:14px;color:#4f818b">drag to orbit · scroll to zoom · shift-drag to pan</div>
  </aside>
</main>

<footer>
  <label>from</label><select id="from"></select>
  <label>to</label><select id="to"></select>
  <span class="chk"><input type="checkbox" id="acc"><label for="acc" style="cursor:pointer">step-free</label></span>
  <button class="go" id="go">Route</button>
  <span style="width:22px"></span>
  <label>node</label><select id="blk"></select>
  <button id="block">Block</button><button id="unblock">Clear</button>
  <span class="spacer" style="flex:1"></span>
  <button id="reset">Reset view</button>
</footer>

<script>
const API = { state:'/3d/state', route:'/3d/route', block:'/3d/block' };
const HGT = { room:92, corridor:30, stairs:74, lift:132, entrance:56 };
const VW = 1400, VH = 780;
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
const el = (t,a,tx)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(tx!=null)e.textContent=tx;return e};

let ST=null, BY={}, ROUTE=null, cam={yaw:-0.5,pitch:0.86,scale:1.02,ox:0,oy:34};
let CX=0, CY=0;

function project(x,y,z){
  const dx=x-CX, dy=y-CY;
  const ca=Math.cos(cam.yaw), sa=Math.sin(cam.yaw);
  const rx=dx*ca-dy*sa, ry=dx*sa+dy*ca;
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  return [ VW/2+cam.ox+rx*cam.scale,
           VH/2+cam.oy+(ry*sp-z*cp)*cam.scale,
           ry*cp+z*sp ];
}
const avgz = p => p.reduce((s,q)=>s+q[2],0)/p.length;
const pts  = p => p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');

function palette(n){
  if(!n.passable)                    return {s:'#ff4d6d', f:'rgba(255,77,109,', t:.30};
  if(ROUTE && ROUTE.includes(n.id))  return {s:'#22d3ee', f:'rgba(34,211,238,',  t:.34};
  return {s:'#5eead4', f:'rgba(94,234,212,', t:.16};
}

function render(){
  if(!ST) return;
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const [,,vw,vh] = ST.svg_viewbox;

  // ground grid
  const g = el('g',{opacity:'.28'});
  for(let x=0;x<=vw;x+=100){ const a=project(x,0,0), b=project(x,vh,0);
    g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#125561','stroke-width':1})); }
  for(let y=0;y<=vh;y+=100){ const a=project(0,y,0), b=project(vw,y,0);
    g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#125561','stroke-width':1})); }
  svg.appendChild(g);

  // every face of every node, painter-sorted
  const faces=[];
  for(const n of ST.nodes){
    const [x,y,w,h]=n.svg_rect, z=HGT[n.type]||40;
    const c=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
    faces.push({p:c.map(q=>project(q[0],q[1],z)), n, top:true});
    for(let i=0;i<4;i++){
      const a=c[i], b=c[(i+1)%4];
      faces.push({p:[project(a[0],a[1],0),project(b[0],b[1],0),project(b[0],b[1],z),project(a[0],a[1],z)], n, top:false});
    }
  }
  faces.sort((a,b)=>avgz(a.p)-avgz(b.p));
  for(const f of faces){
    const c=palette(f.n), op=f.top?c.t:c.t*0.45;
    svg.appendChild(el('polygon',{points:pts(f.p), fill:c.f+op+')', stroke:c.s,
      'stroke-width':f.top?1.6:0.9, 'stroke-opacity':f.top?0.95:0.5,
      class: f.n.passable?'':'pulse'}));
  }

  // route polyline, floating above the volumes
  if(ROUTE && ROUTE.length>1){
    const rp = ROUTE.map(id=>{const n=BY[id]; return project(n.xy[0],n.xy[1],(HGT[n.type]||40)+16)});
    svg.appendChild(el('polyline',{points:pts(rp),fill:'none',stroke:'#0e7490','stroke-width':9,
      'stroke-linejoin':'round','stroke-linecap':'round','stroke-opacity':.5}));
    svg.appendChild(el('polyline',{points:pts(rp),fill:'none',stroke:'#67e8f9','stroke-width':3.5,
      'stroke-dasharray':'14 8','stroke-linejoin':'round','stroke-linecap':'round',class:'route'}));
    rp.forEach((q,i)=>svg.appendChild(el('circle',{cx:q[0],cy:q[1],r:i===0||i===rp.length-1?7:4,
      fill:i===0?'#4ade80':i===rp.length-1?'#67e8f9':'#0e7490',stroke:'#03080e','stroke-width':2})));
  }

  // screen-aligned labels last
  for(const n of ST.nodes){
    const [x,y,w,h]=n.svg_rect, z=HGT[n.type]||40;
    const q=project(x+w/2,y+h/2,z+8);
    svg.appendChild(el('text',{x:q[0],y:q[1],'text-anchor':'middle','font-size':15,
      fill:n.passable?'#dff7f4':'#ff90a4','font-weight':600}, n.name));
  }
}

function panel(r){
  const o=document.getElementById('out');
  if(!r){o.innerHTML='<p style="color:#4f818b">Pick a start and destination below.</p>';return}
  if(!r.path.length){o.innerHTML='<div class="reason">'+(r.reason||'No route.')+'</div>';return}
  o.innerHTML='<div class="dist">'+r.distance_m+' m</div><ol>'+
    r.steps.map(s=>'<li>'+s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</li>').join('')+'</ol>';
  const bl=ST.nodes.filter(n=>!n.passable);
  if(bl.length) o.innerHTML+='<p class="k">Blocked</p>'+bl.map(n=>'<div class="blocked">✕ '+n.name+'</div>').join('');
}

async function loadState(){
  ST = await (await fetch(API.state)).json();
  BY = Object.fromEntries(ST.nodes.map(n=>[n.id,n]));
  const [,,vw,vh]=ST.svg_viewbox; CX=vw/2; CY=vh/2;
  document.getElementById('bld').textContent = ST.building+' · level '+ST.floor+' · '+ST.nodes.length+' spaces';
  for(const id of ['from','to','blk']){
    const s=document.getElementById(id); s.innerHTML='';
    ST.nodes.forEach(n=>s.appendChild(new Option(n.name,n.id)));
  }
  document.getElementById('from').value='entrance_porch';
  document.getElementById('to').value='heritage_gallery';
  render();
}

async function doRoute(){
  const q=new URLSearchParams({from:document.getElementById('from').value,
    to:document.getElementById('to').value, accessible:document.getElementById('acc').checked});
  const r=await (await fetch(API.route+'?'+q)).json();
  ROUTE=r.path; panel(r); render();
}
async function setBlock(p){
  const n=document.getElementById('blk').value;
  await fetch(API.block+'?node='+encodeURIComponent(n)+'&passable='+p,{method:'POST'});
  await loadState();
  if(ROUTE) await doRoute(); else render();
}

document.getElementById('go').onclick=doRoute;
document.getElementById('block').onclick=()=>setBlock(false);
document.getElementById('unblock').onclick=()=>setBlock(true);
document.getElementById('reset').onclick=()=>{cam={yaw:-0.5,pitch:0.86,scale:1.02,ox:0,oy:34};render()};

const stage=document.getElementById('stage');
let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sh:e.shiftKey};stage.classList.add('drag');stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(drag.sh){ cam.ox+=dx; cam.oy+=dy; }
  else { cam.yaw+=dx*0.006; cam.pitch=Math.max(0.16,Math.min(1.50,cam.pitch-dy*0.005)); }
  render();
});
addEventListener('pointerup',()=>{drag=null;stage.classList.remove('drag')});
stage.addEventListener('wheel',e=>{e.preventDefault();
  cam.scale=Math.max(0.35,Math.min(2.4,cam.scale*(1-e.deltaY*0.0012)));render()},{passive:false});

loadState();
</script>
