<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<script defer src="/analytics.js"></script>
<title>Spatial Twin</title>
<style>
/* ---------------------------------------------------------------------------
   Same system as holo.html. White is the voice of the building, cyan is the
   voice of the system - so cyan appears only on a live reading pulled from
   /state, never as decoration. Monospace is the instrument layer, sans is the
   human one. Hairlines and corner ticks, no radius, no gradients, no lift.
--------------------------------------------------------------------------- */
:root{
  --void:#07090c; --plate:#0b0f14; --sunk:#080b0f;
  --rule:#18222b; --rule2:#26333d;
  --ink:#e9eef3; --dim:#6d808c; --dimmer:#3f4e58;
  --live:#00e5ff;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:14px/1.5 var(--sans);
     display:grid;grid-template-rows:auto 1fr}

header{display:flex;align-items:center;gap:20px;padding:0 20px;height:52px;
       border-bottom:1px solid var(--rule);background:var(--plate)}
.mark{font:600 13px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase}
.mark i{color:var(--live);font-style:normal}
.grow{flex:1}
.disc{font:400 10px/1 var(--mono);color:var(--dimmer);letter-spacing:.1em;text-transform:uppercase}

#stage{position:relative;display:grid;place-content:center;padding:40px;min-height:0}
.tick{position:absolute;width:14px;height:14px;pointer-events:none;border:0 solid var(--rule2)}
.tick.tl{top:12px;left:12px;border-top-width:1px;border-left-width:1px}
.tick.tr{top:12px;right:12px;border-top-width:1px;border-right-width:1px}
.tick.bl{bottom:12px;left:12px;border-bottom-width:1px;border-left-width:1px}
.tick.br{bottom:12px;right:12px;border-bottom-width:1px;border-right-width:1px}

.k{font:500 10px/1 var(--mono);letter-spacing:.22em;color:var(--dimmer);text-transform:uppercase;
   margin:0 0 14px;display:flex;align-items:center;gap:10px}
.k::after{content:"";flex:1;height:1px;background:var(--rule)}

.twins{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:1px;
       background:var(--rule);border:1px solid var(--rule);min-width:min(600px,86vw)}
a.twin{display:block;background:var(--plate);padding:26px 24px 22px;text-decoration:none;color:inherit;
       border-left:2px solid transparent}
a.twin:hover,a.twin:focus-visible{background:var(--sunk);border-left-color:var(--live);outline:none}
a.twin .idx{font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--dimmer)}
a.twin .name{display:block;margin:12px 0 0;font:600 25px/1.1 var(--sans);letter-spacing:-.01em;color:var(--ink)}
a.twin .sub{display:block;margin-top:4px;font:400 11px/1 var(--mono);letter-spacing:.12em;
            color:var(--dim);text-transform:uppercase}
a.twin .read{display:block;margin-top:18px;font:400 11px/1 var(--mono);letter-spacing:.13em;
             color:var(--live);text-transform:uppercase;min-height:11px}
a.twin .go{display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:14px;
           border-top:1px solid var(--rule);font:500 10px/1 var(--mono);letter-spacing:.18em;
           color:var(--dim);text-transform:uppercase}
a.twin:hover .go{color:var(--ink)}
a.twin .go s{flex:1;height:0;border-top:1px solid var(--rule2);text-decoration:none}

.hud{position:absolute;bottom:26px;left:26px;font:400 10px/1.7 var(--mono);letter-spacing:.11em;
     color:var(--dim);text-transform:uppercase;pointer-events:none}
.hud b{color:var(--ink);font-weight:500}
.hud .cy{color:var(--live)}
.hud.br{left:auto;right:26px;text-align:right}

/* ---- phone: the choice is still the first thing you see, it just fits the thumb.
   Nothing scrolls; the two cards and the readout sit inside one viewport. ---- */
@media (max-width:720px){
  html,body{height:100dvh;overflow:hidden}
  header{height:44px;padding:0 14px;gap:10px}
  .disc{display:none}
  #stage{padding:16px 14px calc(14px + env(safe-area-inset-bottom));
         grid-template-columns:minmax(0,1fr);place-content:center stretch}
  .tick{display:none}
  .twins{min-width:0;width:100%;grid-template-columns:1fr}
  a.twin{padding:18px 18px 16px}
  a.twin .name{font-size:22px;margin-top:9px}
  a.twin .go{margin-top:13px;padding-top:11px}
  .hud{position:static;margin-top:16px;text-align:center}
  .hud.br{display:none}
}

/* Fold cover / very narrow */
@media (max-width:380px){
  header{padding:0 10px}
  .mark{font-size:11px;letter-spacing:.16em}
  a.twin{padding:15px 15px 13px}
  a.twin .name{font-size:19px}
  a.twin .sub,a.twin .read{font-size:10px}
}

/* Landscape phone / Flip 880x360: two cards side by side rather than stacked, or the
   second one falls off the bottom of a 360px viewport. */
@media (max-width:900px) and (max-height:560px){
  header{height:38px}
  #stage{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .twins{grid-template-columns:1fr 1fr}
  a.twin{padding:12px 14px}
  a.twin .name{font-size:17px;margin-top:6px}
  a.twin .go{margin-top:9px;padding-top:8px}
  .k{margin-bottom:8px}
  .hud{margin-top:9px}
}</style>

<header>
  <span class="mark">Spatial<i>&middot;</i>Twin</span>
  <span class="grow"></span>
  <span class="disc">Illustrative approximation</span>
</header>

<div id="stage">
  <span class="tick tl"></span><span class="tick tr"></span>
  <span class="tick bl"></span><span class="tick br"></span>

  <div>
    <p class="k">Select a twin</p>
    <nav class="twins">
      <a class="twin" href="/aryabhatta">
        <span class="idx">01</span>
        <span class="name">Aryabhatta</span>
        <span class="sub">KJSSE &middot; Vidyavihar</span>
        <span class="read" id="r-aryabhatta"></span>
        <span class="go">Open twin <s></s> &rarr;</span>
      </a>
      <a class="twin" href="/bhaskaracharya">
        <span class="idx">02</span>
        <span class="name">Bhaskaracharya</span>
        <span class="sub">KJSSE &middot; Vidyavihar</span>
        <span class="read" id="r-bhaskaracharya"></span>
        <span class="go">Open twin <s></s> &rarr;</span>
      </a>
    </nav>
  </div>

  <div class="hud" id="hud">link &middot; <b>querying</b></div>
  <div class="hud br">modelled from emergency escape route boards</div>
</div>

<script>
// cyan is reserved for what the system is asserting, so these readings stay blank
// until /state actually answers - nothing is claimed that the server hasn't served
// Registration is best-effort on purpose. A service worker needs a secure context, so over
// plain LAN http://192.168.x.x:8000 this throws - the page must behave identically either way.
if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('/sw.js').catch(e => console.info('sw not registered:', e.message));

const KEYS = ['aryabhatta', 'bhaskaracharya'];
let spaces = 0, live = 0;

Promise.all(KEYS.map(k =>
  fetch('/' + k + '/state')
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      const levels = new Set(d.nodes.map(n => n.floor || 1)).size;
      document.getElementById('r-' + k).textContent =
        d.nodes.length + ' spaces / ' + levels + ' levels';
      spaces += d.nodes.length; live++;
    })
    .catch(() => { document.getElementById('r-' + k).textContent = 'offline'; })
)).then(() => {
  document.getElementById('hud').innerHTML = live
    ? 'link <b class="cy">ok</b> &middot; twins <b>' + live + '</b> &middot; spaces <b>' + spaces + '</b>'
    : 'link <b>down</b>';
});
</script>
